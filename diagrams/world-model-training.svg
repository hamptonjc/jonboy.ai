<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1024" role="img" aria-labelledby="title desc"><title id="title">Full training stages and agent connections</title><desc id="desc">Four training stages: collect data, train VAE, train memory model, optimize the controller with CMA-ES. During deployment the environment sends observations to the encoder. Latent features feed both memory and controller. Memory receives the previous action and supplies updated hidden features to the controller. Controller actions go back to the environment.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#dbe2d1}.title{font-size:16px;font-weight:500}.label{font-family:monospace;font-size:12px;fill:#a8b59b}.note{font-size:12px;fill:#a8b59b}.kicker{font-family:monospace;font-size:11px;letter-spacing:1.4px;fill:#c5d6aa}.box{fill:#171e14;stroke:#53634a;stroke-width:1}.accent{fill:#202b19;stroke:#9ab480;stroke-width:1}.edge{stroke:#a9bf94;stroke-width:1.4;fill:none}.dash{stroke-dasharray:5 5}</style><defs><marker id="f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a9bf94" stroke-width="1.5"/></marker></defs><rect width="720" height="100%" fill="#0c100b"/><text x="24" y="24" class="kicker" text-anchor="start">TRAINING / FROM RECORDED FRAMES TO A CONTROLLER</text><rect x="24" y="54" width="672" height="84" rx="5" class="box"/><text x="360.0" y="82" class="title" text-anchor="middle">01 / Collect trajectories</text><text x="360.0" y="106" class="label" text-anchor="middle">CarRacing observations + actions → recorded dataset</text><path d="M360 138V166" class="edge " marker-end="url(#f-arrow)"/><rect x="24" y="166" width="672" height="84" rx="5" class="box"/><text x="360.0" y="194" class="title" text-anchor="middle">02 / Train V-Net</text><text x="360.0" y="218" class="label" text-anchor="middle">Frames → encoder → z → decoder → reconstruction + KL loss</text><path d="M360 250V278" class="edge " marker-end="url(#f-arrow)"/><rect x="24" y="278" width="672" height="84" rx="5" class="box"/><text x="360.0" y="306" class="title" text-anchor="middle">03 / Train M-Net</text><text x="360.0" y="330" class="label" text-anchor="middle">Encode trajectories with trained V; learn next-latent distributions</text><path d="M360 362V390" class="edge " marker-end="url(#f-arrow)"/><rect x="24" y="390" width="672" height="84" rx="5" class="accent"/><text x="360.0" y="418" class="title" text-anchor="middle">04 / Optimize C-Net</text><text x="360.0" y="442" class="label" text-anchor="middle">Freeze V + M; CMA-ES proposes C weights; environment returns score them</text><text x="24" y="545" class="kicker" text-anchor="start">ROLLOUT / HOW V, M, C AND THE ENVIRONMENT CONNECT</text><rect x="24" y="590" width="180" height="100" rx="5" class="box"/><text x="114.0" y="618" class="title" text-anchor="middle">CarRacing</text><text x="114.0" y="642" class="label" text-anchor="middle">Observation</text><text x="114.0" y="661" class="label" text-anchor="middle">Episode reward</text><rect x="264" y="590" width="180" height="100" rx="5" class="box"/><text x="354.0" y="618" class="title" text-anchor="middle">V encoder</text><text x="354.0" y="642" class="label" text-anchor="middle">Observation → z</text><text x="354.0" y="661" class="label" text-anchor="middle">32 latent features</text><rect x="504" y="590" width="192" height="100" rx="5" class="box"/><text x="600.0" y="618" class="title" text-anchor="middle">M network</text><text x="600.0" y="642" class="label" text-anchor="middle">z + previous action</text><text x="600.0" y="661" class="label" text-anchor="middle">Updated h; MDN prediction</text><path d="M204 640H264" class="edge " marker-end="url(#f-arrow)"/><path d="M444 640H504" class="edge " marker-end="url(#f-arrow)"/><rect x="354" y="800" width="250" height="100" rx="5" class="accent"/><text x="479.0" y="828" class="title" text-anchor="middle">C controller</text><text x="479.0" y="852" class="label" text-anchor="middle">Concatenate z + updated h</text><text x="479.0" y="871" class="label" text-anchor="middle">Linear layer → action</text><path d="M354 690V800" class="edge " marker-end="url(#f-arrow)"/><text x="337" y="749" class="note" text-anchor="middle">z</text><path d="M600 690V756H545V800" class="edge " marker-end="url(#f-arrow)"/><text x="617" y="741" class="note" text-anchor="middle">h</text><path d="M354 850H114V690" class="edge " marker-end="url(#f-arrow)"/><text x="182" y="835" class="note" text-anchor="middle">action → next observation</text><path d="M604 852H704V566H600V590" class="edge dash" marker-end="url(#f-arrow)"/><text x="626" y="558" class="note" text-anchor="middle">previous action</text><text x="24" y="978" class="note" text-anchor="start">Solid arrows: live agent data. Dashed arrow: action carried to the next step.</text><text x="24" y="1000" class="note" text-anchor="start">M’s predictive head trains the representation; C receives its hidden features.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="title desc"><title id="title">M-Net architecture</title><desc id="desc">A 32-dimensional latent vector and three action values feed a 256-unit LSTM. The LSTM feeds three mixture-density heads and also provides memory features to the controller. Five Gaussian components predict the next latent vector.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#dbe2d1}.title{font-size:16px;font-weight:500}.label{font-family:monospace;font-size:12px;fill:#a8b59b}.note{font-size:12px;fill:#a8b59b}.kicker{font-family:monospace;font-size:11px;letter-spacing:1.4px;fill:#c5d6aa}.box{fill:#171e14;stroke:#53634a;stroke-width:1}.accent{fill:#202b19;stroke:#9ab480;stroke-width:1}.edge{stroke:#a9bf94;stroke-width:1.4;fill:none}.dash{stroke-dasharray:5 5}</style><defs><marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a9bf94" stroke-width="1.5"/></marker></defs><rect width="720" height="100%" fill="#0c100b"/><text x="24" y="24" class="kicker" text-anchor="start">M / MEMORY · MIXTURE-DENSITY RECURRENT MODEL</text><rect x="24" y="80" width="200" height="100" rx="5" class="box"/><text x="124.0" y="108" class="title" text-anchor="middle">Concatenate inputs</text><text x="124.0" y="132" class="label" text-anchor="middle">z: 32 + action: 3</text><text x="124.0" y="151" class="label" text-anchor="middle">35 features per time step</text><rect x="264" y="80" width="200" height="100" rx="5" class="accent"/><text x="364.0" y="108" class="title" text-anchor="middle">LSTM</text><text x="364.0" y="132" class="label" text-anchor="middle">256 hidden units</text><text x="364.0" y="151" class="label" text-anchor="middle">Hidden + cell state carried</text><rect x="514" y="80" width="182" height="100" rx="5" class="box"/><text x="605.0" y="108" class="title" text-anchor="middle">Memory features h</text><text x="605.0" y="132" class="label" text-anchor="middle">256 dimensions</text><text x="605.0" y="151" class="label" text-anchor="middle">Also sent to C-Net</text><path d="M224 130H264" class="edge " marker-end="url(#m-arrow)"/><path d="M464 130H514" class="edge " marker-end="url(#m-arrow)"/><path d="M402 80V48H490V118H464" class="edge dash" marker-end="url(#m-arrow)"/><text x="560" y="52" class="note" text-anchor="middle">recurrent state</text><rect x="24" y="258" width="200" height="100" rx="5" class="box"/><text x="124.0" y="286" class="title" text-anchor="middle">Mixing weights π</text><text x="124.0" y="310" class="label" text-anchor="middle">Linear 256 → 5</text><text x="124.0" y="329" class="label" text-anchor="middle">Softmax with temperature</text><rect x="264" y="258" width="200" height="100" rx="5" class="box"/><text x="364.0" y="286" class="title" text-anchor="middle">Means μ</text><text x="364.0" y="310" class="label" text-anchor="middle">Linear 256 → 160</text><text x="364.0" y="329" class="label" text-anchor="middle">5 components × 32 values</text><rect x="514" y="258" width="182" height="100" rx="5" class="box"/><text x="605.0" y="286" class="title" text-anchor="middle">Scales σ</text><text x="605.0" y="310" class="label" text-anchor="middle">Linear 256 → 160</text><text x="605.0" y="329" class="label" text-anchor="middle">exp; temperature scaling</text><path d="M364 180V218H124V258" class="edge " marker-end="url(#m-arrow)"/><path d="M364 218V258" class="edge " marker-end="url(#m-arrow)"/><path d="M364 218H605V258" class="edge " marker-end="url(#m-arrow)"/><rect x="184" y="438" width="352" height="100" rx="5" class="accent"/><text x="360.0" y="466" class="title" text-anchor="middle">Next-latent distribution</text><text x="360.0" y="490" class="label" text-anchor="middle">5 diagonal Gaussian components</text><text x="360.0" y="509" class="label" text-anchor="middle">Negative log-likelihood trains M</text><path d="M124 358V400H320V438" class="edge " marker-end="url(#m-arrow)"/><path d="M364 358V438" class="edge " marker-end="url(#m-arrow)"/><path d="M605 358V400H410V438" class="edge " marker-end="url(#m-arrow)"/><text x="24" y="577" class="note" text-anchor="start">Policy rollout input: current z and previous action; h goes to the controller.</text></svg>
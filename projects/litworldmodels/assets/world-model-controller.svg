<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">C-Net architecture and CMA-ES</title><desc id="desc">32 vision features and 256 memory features concatenate into 288 inputs. One affine layer produces three continuous controls. CMA-ES optimizes 867 controller parameters using environment returns while vision and memory remain frozen.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#dbe2d1}.title{font-size:16px;font-weight:500}.label{font-family:monospace;font-size:12px;fill:#a8b59b}.note{font-size:12px;fill:#a8b59b}.kicker{font-family:monospace;font-size:11px;letter-spacing:1.4px;fill:#c5d6aa}.box{fill:#171e14;stroke:#53634a;stroke-width:1}.accent{fill:#202b19;stroke:#9ab480;stroke-width:1}.edge{stroke:#a9bf94;stroke-width:1.4;fill:none}.dash{stroke-dasharray:5 5}</style><defs><marker id="c-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a9bf94" stroke-width="1.5"/></marker></defs><rect width="720" height="100%" fill="#0c100b"/><text x="24" y="24" class="kicker" text-anchor="start">C / CONTROLLER · SMALL POLICY, EVOLUTIONARY OPTIMIZATION</text><rect x="24" y="72" width="180" height="84" rx="5" class="box"/><text x="114.0" y="100" class="title" text-anchor="middle">Vision features z</text><text x="114.0" y="124" class="label" text-anchor="middle">32 dimensions</text><rect x="24" y="204" width="180" height="84" rx="5" class="box"/><text x="114.0" y="232" class="title" text-anchor="middle">Memory features h</text><text x="114.0" y="256" class="label" text-anchor="middle">256 dimensions</text><rect x="254" y="126" width="180" height="100" rx="5" class="box"/><text x="344.0" y="154" class="title" text-anchor="middle">Concatenate [z, h]</text><text x="344.0" y="178" class="label" text-anchor="middle">288 input features</text><rect x="484" y="126" width="212" height="100" rx="5" class="accent"/><text x="590.0" y="154" class="title" text-anchor="middle">Linear controller</text><text x="590.0" y="178" class="label" text-anchor="middle">288 → 3 + bias</text><text x="590.0" y="197" class="label" text-anchor="middle">867 trainable parameters</text><path d="M204 114H228V160H254" class="edge " marker-end="url(#c-arrow)"/><path d="M204 246H228V192H254" class="edge " marker-end="url(#c-arrow)"/><path d="M434 176H484" class="edge " marker-end="url(#c-arrow)"/><rect x="484" y="310" width="212" height="120" rx="5" class="box"/><text x="590.0" y="338" class="title" text-anchor="middle">Action scaling</text><text x="590.0" y="362" class="label" text-anchor="middle">Steering: tanh</text><text x="590.0" y="381" class="label" text-anchor="middle">Gas / brake: sigmoid</text><text x="590.0" y="400" class="label" text-anchor="middle">3 continuous controls</text><path d="M590 226V310" class="edge " marker-end="url(#c-arrow)"/><rect x="24" y="354" width="390" height="100" rx="5" class="box"/><text x="219.0" y="382" class="title" text-anchor="middle">CMA-ES search</text><text x="219.0" y="406" class="label" text-anchor="middle">Sample controller weights → evaluate rollouts</text><text x="219.0" y="425" class="label" text-anchor="middle">Use episode returns to update the search</text><path d="M414 388H450V176H484" class="edge dash" marker-end="url(#c-arrow)"/><text x="24" y="498" class="note" text-anchor="start">V-Net and M-Net remain frozen during controller optimization.</text></svg>
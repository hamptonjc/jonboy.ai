<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 566" role="img" aria-labelledby="title desc"><title id="title">V-Net architecture</title><desc id="desc">64 by 64 RGB observation, four convolutional layers, Gaussian posterior heads, 32-dimensional sample, decoder, reconstructed observation. Reconstruction and KL losses train the VAE.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#dbe2d1}.title{font-size:16px;font-weight:500}.label{font-family:monospace;font-size:12px;fill:#a8b59b}.note{font-size:12px;fill:#a8b59b}.kicker{font-family:monospace;font-size:11px;letter-spacing:1.4px;fill:#c5d6aa}.box{fill:#171e14;stroke:#53634a;stroke-width:1}.accent{fill:#202b19;stroke:#9ab480;stroke-width:1}.edge{stroke:#a9bf94;stroke-width:1.4;fill:none}.dash{stroke-dasharray:5 5}</style><defs><marker id="v-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a9bf94" stroke-width="1.5"/></marker></defs><rect width="720" height="100%" fill="#0c100b"/><text x="24" y="24" class="kicker" text-anchor="start">V / VISION · VARIATIONAL AUTOENCODER</text><rect x="24" y="88" width="170" height="90" rx="5" class="box"/><text x="109.0" y="116" class="title" text-anchor="middle">Observation</text><text x="109.0" y="140" class="label" text-anchor="middle">RGB · 64 × 64 × 3</text><rect x="244" y="54" width="240" height="170" rx="5" class="box"/><text x="364.0" y="82" class="title" text-anchor="middle">Convolutional encoder</text><text x="364.0" y="106" class="label" text-anchor="middle">Channels 32 → 64 → 128 → 256</text><text x="364.0" y="125" class="label" text-anchor="middle">4 × 4 kernels · stride 2</text><text x="364.0" y="144" class="label" text-anchor="middle">ReLU after each convolution</text><text x="364.0" y="163" class="label" text-anchor="middle">Flatten: 256 × 2 × 2 = 1024</text><rect x="534" y="88" width="162" height="90" rx="5" class="box"/><text x="615.0" y="116" class="title" text-anchor="middle">Posterior heads</text><text x="615.0" y="140" class="label" text-anchor="middle">μ and log σ²</text><text x="615.0" y="159" class="label" text-anchor="middle">32 values each</text><rect x="534" y="282" width="162" height="110" rx="5" class="accent"/><text x="615.0" y="310" class="title" text-anchor="middle">Sample z</text><text x="615.0" y="334" class="label" text-anchor="middle">32 dimensions</text><text x="615.0" y="353" class="label" text-anchor="middle">μ + σ ⊙ ε</text><text x="615.0" y="372" class="label" text-anchor="middle">ε ∼ N(0, I)</text><rect x="244" y="252" width="240" height="170" rx="5" class="box"/><text x="364.0" y="280" class="title" text-anchor="middle">Decoder</text><text x="364.0" y="304" class="label" text-anchor="middle">Linear 32 → 1024; reshape</text><text x="364.0" y="323" class="label" text-anchor="middle">Transposed conv: 128, 64, 32, 3</text><text x="364.0" y="342" class="label" text-anchor="middle">Kernels 5, 5, 6, 6 · stride 2</text><text x="364.0" y="361" class="label" text-anchor="middle">ReLU; final sigmoid</text><rect x="24" y="292" width="170" height="90" rx="5" class="box"/><text x="109.0" y="320" class="title" text-anchor="middle">Reconstruction</text><text x="109.0" y="344" class="label" text-anchor="middle">64 × 64 × 3</text><text x="109.0" y="363" class="label" text-anchor="middle">Pixel values in [0, 1]</text><path d="M194 133H244" class="edge " marker-end="url(#v-arrow)"/><path d="M484 133H534" class="edge " marker-end="url(#v-arrow)"/><path d="M615 178V282" class="edge " marker-end="url(#v-arrow)"/><path d="M534 337H484" class="edge " marker-end="url(#v-arrow)"/><path d="M244 337H194" class="edge " marker-end="url(#v-arrow)"/><rect x="24" y="464" width="672" height="80" rx="5" class="box"/><text x="360.0" y="492" class="title" text-anchor="middle">Training objective</text><text x="360.0" y="516" class="label" text-anchor="middle">Image reconstruction MSE + KL divergence (with tolerance floor)</text></svg>
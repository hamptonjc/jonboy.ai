<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">One convolution, four output partitions</title><desc id="desc">A shared input buffer feeds four padding and convolution branches. Two row groups and two channel groups produce four disjoint output regions, assembled in a shared output buffer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a7c5bc"/></marker></defs><rect width="720" height="620" fill="#0c100b"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="360" y="38" fill="#c5d6aa" font-size="12" letter-spacing="2">PARTITION THE OUTPUT, ROUTE THE INPUT</text><rect x="130" y="64" width="460" height="76" rx="3" fill="#1b2418" stroke="#829775"/><text x="360" y="94" fill="#dbe2d1" font-size="19">Shared input · 128 × 128 × 1</text><text x="360" y="119" fill="#9da694" font-size="12">Read the rows each branch needs, including overlap</text><g fill="none" stroke="#a7c5bc" marker-end="url(#arrow)"><path d="M360 140V170H185V205"/><path d="M360 170H535V205"/><path d="M50 170H360M50 170V350H185V370"/><path d="M670 170H360M670 170V350H535V370"/></g><rect x="80" y="205" width="250" height="125" rx="3" fill="#171e14" stroke="#829775"/><text x="205" y="233" fill="#c5d6aa" font-size="15">Branch 0 · Pad → Conv + ReLU</text><text x="205" y="262" fill="#dbe2d1" font-size="15">Output rows 0–31</text><text x="205" y="286" fill="#dbe2d1" font-size="15">Output channels 0–31</text><text x="205" y="311" fill="#9da694" font-size="12">64 × 32 × 32 output elements</text><rect x="390" y="205" width="250" height="125" rx="3" fill="#171e14" stroke="#829775"/><text x="515" y="233" fill="#c5d6aa" font-size="15">Branch 1 · Pad → Conv + ReLU</text><text x="515" y="262" fill="#dbe2d1" font-size="15">Output rows 0–31</text><text x="515" y="286" fill="#dbe2d1" font-size="15">Output channels 32–63</text><text x="515" y="311" fill="#9da694" font-size="12">64 × 32 × 32 output elements</text><rect x="80" y="370" width="250" height="125" rx="3" fill="#171e14" stroke="#829775"/><text x="205" y="398" fill="#c5d6aa" font-size="15">Branch 2 · Pad → Conv + ReLU</text><text x="205" y="427" fill="#dbe2d1" font-size="15">Output rows 32–63</text><text x="205" y="451" fill="#dbe2d1" font-size="15">Output channels 0–31</text><text x="205" y="476" fill="#9da694" font-size="12">64 × 32 × 32 output elements</text><rect x="390" y="370" width="250" height="125" rx="3" fill="#171e14" stroke="#829775"/><text x="515" y="398" fill="#c5d6aa" font-size="15">Branch 3 · Pad → Conv + ReLU</text><text x="515" y="427" fill="#dbe2d1" font-size="15">Output rows 32–63</text><text x="515" y="451" fill="#dbe2d1" font-size="15">Output channels 32–63</text><text x="515" y="476" fill="#9da694" font-size="12">64 × 32 × 32 output elements</text><g fill="none" stroke="#a7c5bc" marker-end="url(#arrow)"><path d="M80 268H26V540H130"/><path d="M640 268H694V540H590"/><path d="M205 495V512H270V528"/><path d="M515 495V512H450V528"/></g><rect x="130" y="528" width="460" height="66" rx="3" fill="#1b2418" stroke="#829775"/><text x="360" y="555" fill="#dbe2d1" font-size="19">Shared output · 64 × 64 × 64</text><text x="360" y="578" fill="#9da694" font-size="12">Disjoint writes at each branch’s row and channel offset</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-label="Unfolding four 2 by 2 windows into a matrix"><rect width="720" height="490" fill="#0c100b"/><g font-family="Arial,sans-serif"><text x="360" y="32" fill="#c5d6aa" font-size="12" text-anchor="middle">IM2COL: A COLUMN FOR EACH OUTPUT POSITION</text><text x="125" y="76" fill="#dbe2d1" font-size="15" text-anchor="middle">Input · 3 × 3</text><rect x="50" y="100" width="50" height="50" fill="#2c3c23" stroke="#829775"/><text x="75" y="131" fill="#dbe2d1" font-size="18" text-anchor="middle">1</text><rect x="100" y="100" width="50" height="50" fill="#2c3c23" stroke="#829775"/><text x="125" y="131" fill="#dbe2d1" font-size="18" text-anchor="middle">2</text><rect x="150" y="100" width="50" height="50" fill="#141c11" stroke="#829775"/><text x="175" y="131" fill="#dbe2d1" font-size="18" text-anchor="middle">3</text><rect x="50" y="150" width="50" height="50" fill="#2c3c23" stroke="#829775"/><text x="75" y="181" fill="#dbe2d1" font-size="18" text-anchor="middle">4</text><rect x="100" y="150" width="50" height="50" fill="#2c3c23" stroke="#829775"/><text x="125" y="181" fill="#dbe2d1" font-size="18" text-anchor="middle">5</text><rect x="150" y="150" width="50" height="50" fill="#141c11" stroke="#829775"/><text x="175" y="181" fill="#dbe2d1" font-size="18" text-anchor="middle">6</text><rect x="50" y="200" width="50" height="50" fill="#141c11" stroke="#829775"/><text x="75" y="231" fill="#dbe2d1" font-size="18" text-anchor="middle">7</text><rect x="100" y="200" width="50" height="50" fill="#141c11" stroke="#829775"/><text x="125" y="231" fill="#dbe2d1" font-size="18" text-anchor="middle">8</text><rect x="150" y="200" width="50" height="50" fill="#141c11" stroke="#829775"/><text x="175" y="231" fill="#dbe2d1" font-size="18" text-anchor="middle">9</text><text x="125" y="281" fill="#9da694" font-size="12" text-anchor="middle">2 × 2 filter · stride 1</text><path d="M220 174H313M303 168L313 174L303 180" fill="none" stroke="#a7c5bc" stroke-width="1.5"/><text x="268" y="149" fill="#a7c5bc" font-size="12" text-anchor="middle">unfold</text><text x="502" y="76" fill="#dbe2d1" font-size="15" text-anchor="middle">Patches · 4 × 4</text><rect x="352" y="100" width="72" height="42" fill="#2c3c23" stroke="#829775"/><text x="388" y="127" fill="#dbe2d1" font-size="17" text-anchor="middle">1</text><rect x="424" y="100" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="460" y="127" fill="#dbe2d1" font-size="17" text-anchor="middle">2</text><rect x="496" y="100" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="532" y="127" fill="#dbe2d1" font-size="17" text-anchor="middle">4</text><rect x="568" y="100" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="604" y="127" fill="#dbe2d1" font-size="17" text-anchor="middle">5</text><rect x="352" y="142" width="72" height="42" fill="#2c3c23" stroke="#829775"/><text x="388" y="169" fill="#dbe2d1" font-size="17" text-anchor="middle">2</text><rect x="424" y="142" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="460" y="169" fill="#dbe2d1" font-size="17" text-anchor="middle">3</text><rect x="496" y="142" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="532" y="169" fill="#dbe2d1" font-size="17" text-anchor="middle">5</text><rect x="568" y="142" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="604" y="169" fill="#dbe2d1" font-size="17" text-anchor="middle">6</text><rect x="352" y="184" width="72" height="42" fill="#2c3c23" stroke="#829775"/><text x="388" y="211" fill="#dbe2d1" font-size="17" text-anchor="middle">4</text><rect x="424" y="184" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="460" y="211" fill="#dbe2d1" font-size="17" text-anchor="middle">5</text><rect x="496" y="184" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="532" y="211" fill="#dbe2d1" font-size="17" text-anchor="middle">7</text><rect x="568" y="184" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="604" y="211" fill="#dbe2d1" font-size="17" text-anchor="middle">8</text><rect x="352" y="226" width="72" height="42" fill="#2c3c23" stroke="#829775"/><text x="388" y="253" fill="#dbe2d1" font-size="17" text-anchor="middle">5</text><rect x="424" y="226" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="460" y="253" fill="#dbe2d1" font-size="17" text-anchor="middle">6</text><rect x="496" y="226" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="532" y="253" fill="#dbe2d1" font-size="17" text-anchor="middle">8</text><rect x="568" y="226" width="72" height="42" fill="#141c11" stroke="#829775"/><text x="604" y="253" fill="#dbe2d1" font-size="17" text-anchor="middle">9</text><text x="500" y="291" fill="#9da694" font-size="12" text-anchor="middle">Repeated values occupy separate matrix entries</text><rect x="45" y="331" width="630" height="63" rx="3" fill="#192316" stroke="#829775"/><text x="360.0" y="367.5" fill="#dbe2d1" font-size="15" text-anchor="middle">Weights [1 × 4] × Patches [4 × 4] = Output [1 × 4]</text><text x="360" y="428" fill="#dbe2d1" font-size="14" text-anchor="middle">Each column is one flattened receptive field.</text><text x="360" y="455" fill="#9da694" font-size="13" text-anchor="middle">Reshape the four output values into a 2 × 2 feature map.</text></g></svg>